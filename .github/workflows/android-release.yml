name: Signed Android release
on: [workflow_dispatch]
permissions: {contents: read}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Install signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Android signing key not configured'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/foxbot-release.jks"
      - name: Build and test
        working-directory: apps/android
        env:
          FOX_ANDROID_KEYSTORE: ${{ runner.temp }}/foxbot-release.jks
          FOX_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          FOX_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FOX_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle test assembleRelease
      - name: Verify signature and normalize filename
        run: |
          APK=apps/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' apps/android/app/build.gradle.kts)
          mkdir -p release/android
          cp "$APK" "release/android/fox-bot-${VERSION}-android-universal.apk"
      - uses: actions/upload-artifact@v4
        with: {name: android-universal, path: 'release/android/*.apk', if-no-files-found: error}
