name: Desktop release builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, arch: x64, platform: win}
          - {os: windows-11-arm, arch: arm64, platform: win}
          - {os: ubuntu-latest, arch: x64, platform: linux}
          - {os: ubuntu-24.04-arm, arch: arm64, platform: linux}
    runs-on: ${{ matrix.os }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/vendor/browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Native helper
        run: cargo build --release --manifest-path native/Cargo.toml
      - name: Install browser transport test and bundled runtime
        run: npx playwright install --with-deps chromium
      - name: Tests
        run: npm test
      - name: Protocol and desktop
        run: npm run build
      - name: Package Windows
        if: matrix.platform == 'win'
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npx electron-builder --win nsis --${{ matrix.arch }}
      - name: Package Linux
        if: matrix.platform == 'linux'
        working-directory: apps/desktop
        run: npx electron-builder --linux AppImage deb rpm tar.gz --${{ matrix.arch }} --config.linux.executableName=fox-bot
      - name: Verify the packaged Windows browser and native helper
        if: matrix.platform == 'win'
        working-directory: apps/desktop
        run: node scripts/smoke.mjs --packaged
      - name: Flatpak dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder elfutils
      - name: Package Flatpak
        if: matrix.platform == 'linux'
        working-directory: apps/desktop
        run: npx electron-builder --linux flatpak --${{ matrix.arch }} --config.linux.executableName=fox-bot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/desktop/*.exe
            release/desktop/*.AppImage
            release/desktop/*.deb
            release/desktop/*.rpm
            release/desktop/*.flatpak
            release/desktop/*.tar.gz
            release/desktop/*.yml
            release/desktop/*.blockmap
          if-no-files-found: error
