services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SIGNALING_DOMAIN: ${SIGNALING_DOMAIN:?Set SIGNALING_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [signaling]
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  signaling:
    build: ../services/signaling
    restart: unless-stopped
    environment:
      RELAY_ADMIN_TOKEN: ${RELAY_ADMIN_TOKEN:?Set a random 32+ character token}
      TURN_SECRET: ${TURN_SECRET:?Set TURN_SECRET}
      TURN_URLS: turn:${TURN_DOMAIN:?Set TURN_DOMAIN}:3478?transport=udp,turn:${TURN_DOMAIN}:3478?transport=tcp
      STATE_FILE: /data/identities.json
    volumes: ["identity_data:/data"]
    expose: ["8787"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
  turn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${TURN_DOMAIN}
      - --external-ip=${TURN_PUBLIC_IP:?Set server public IPv4}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-multicast-peers
      - --no-loopback-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --user-quota=8
      - --total-quota=200
    logging: *logging
volumes:
  identity_data:
  caddy_data:
  caddy_config:
